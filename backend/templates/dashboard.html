<!DOCTYPE html>
<html>
<head>
    <title>Team Task Manager</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">🚀 Team Task Manager</h1>

    <!-- CREATE PROJECT -->
    <div class="card p-3 mb-4 shadow">
        <h4>Create Project</h4>
        <div class="d-flex gap-2">
            <input id="project_name" class="form-control" placeholder="Project Name">
            <button class="btn btn-primary" onclick="createProject()">Create</button>
        </div>
    </div>

    <!-- ADD MEMBER -->
    <div class="card p-3 mb-4 shadow">
        <h4>Add Member</h4>
        <div class="row">
            <div class="col">
                <input id="member_name" class="form-control" placeholder="Username">
            </div>
            <div class="col">
                <input id="project_name_member" class="form-control" placeholder="Project Name">
            </div>
            <div class="col">
                <button class="btn btn-success w-100" onclick="addMember()">Add Member</button>
            </div>
        </div>
    </div>

    <!-- CREATE TASK -->
    <div class="card p-3 mb-4 shadow">
        <h4>Create Task</h4>
        <div class="row mb-2">
            <div class="col">
                <input id="task_title" class="form-control" placeholder="Task Title">
            </div>
            <div class="col">
                <input id="task_user" class="form-control" placeholder="Assign Username">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <input id="task_project" class="form-control" placeholder="Project Name">
            </div>
            <div class="col">
                <input id="task_deadline" type="date" class="form-control">
            </div>
            <div class="col">
                <button class="btn btn-primary w-100" onclick="createTask()">Add Task</button>
            </div>
        </div>
    </div>

</div>

<script>

async function createProject(){
    let name = document.getElementById("project_name").value;

    await fetch("/create_project", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ name })
    });

    alert("✅ Project Created");
}

async function addMember(){
    let username = document.getElementById("member_name").value;
    let project = document.getElementById("project_name_member").value;

    await fetch("/add_member", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            admin_id: localStorage.getItem("user_id"),
            project_id: project,
            username: username
        })
    });

    alert("✅ Member Added");
}

async function createTask(){
    let title = document.getElementById("task_title").value;
    let username = document.getElementById("task_user").value;
    let project = document.getElementById("task_project").value;
    let deadline = document.getElementById("task_deadline").value;

    await fetch("/create_task", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            title,
            username,
            project_id: project,
            deadline
        })
    });

    alert("✅ Task Created");
}

</script>

</body>
</html>
